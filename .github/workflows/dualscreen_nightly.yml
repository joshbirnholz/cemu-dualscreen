# Builds this fork for Linux and Windows on every push to the Dualscreen
# branch and publishes both as one rolling pre-release, "nightly":
# Cemu-dualscreen-x86_64.AppImage and Cemu-dualscreen-windows-x64.zip, always
# at the same address, for Dualscreen to run Wii U games with and to update
# itself from. The upstream workflows (build.yml and the rest) are left as
# they are and still run on main.
#
# The same builds as upstream's -- Ubuntu 22.04 with clang 15, and Windows
# with MSVC, vcpkg with its binary cache in GitHub Packages for both -- for x64
# only, since every device that runs Wii U games for Dualscreen is a PC or a
# Steam Deck. The release is replaced with whichever of them succeeded.

name: Dualscreen nightly

on:
  push:
    branches: [claude/dualscreen-frame-link]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

# One at a time; a push during a build waits rather than cancelling it.
concurrency:
  group: dualscreen-nightly
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  VCPKG_ROOT: "${{ github.workspace }}/dependencies/vcpkg"
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: System dependencies
      run: |
        sudo apt update -qq
        sudo apt install -y clang-15 cmake freeglut3-dev libgcrypt20-dev libglm-dev libgtk-3-dev libpulse-dev libsecret-1-dev libsystemd-dev libudev-dev nasm ninja-build libbluetooth-dev appstream

    - name: Bootstrap vcpkg
      run: bash ./dependencies/vcpkg/bootstrap-vcpkg.sh

    - name: vcpkg's binary cache
      shell: bash
      run: |
        mono `./dependencies/vcpkg/vcpkg fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
        mono `./dependencies/vcpkg/vcpkg fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: Configure
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=release \
          -DCMAKE_C_COMPILER=/usr/bin/clang-15 -DCMAKE_CXX_COMPILER=/usr/bin/clang++-15 \
          -G Ninja -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

    - name: Build
      run: cmake --build build

    - name: AppImage
      run: |
        mv bin/Cemu_release bin/Cemu
        export LD_LIBRARY_PATH="/usr/local/lib:$LD_LIBRARY_PATH"
        export DEPLOY_GTK_VERSION=3
        dist/linux/appimage.sh ${{ runner.arch }}
        mv artifacts/Cemu-*.AppImage Cemu-dualscreen-x86_64.AppImage

    - uses: actions/upload-artifact@v4
      with:
        name: linux
        path: Cemu-dualscreen-x86_64.AppImage

  build-windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.29.0'

    - name: Bootstrap vcpkg
      run: ./dependencies/vcpkg/bootstrap-vcpkg.bat

    - name: vcpkg's binary cache
      shell: bash
      run: |
        `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          sources add \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          -storepasswordincleartext \
          -name "GitHub" \
          -username "${{ github.repository_owner }}" \
          -password "${{ secrets.GITHUB_TOKEN }}"
        `./dependencies/vcpkg/vcpkg.exe fetch nuget | tail -n 1` \
          setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=release -DVCPKG_INSTALL_OPTIONS="--clean-after-build"

    - name: Build
      run: cmake --build build --config release

    # Cemu.exe and the folders it reads beside it, at the top of the zip:
    # Dualscreen unpacks it into a folder of its own.
    - name: Zip
      shell: bash
      run: |
        mkdir -p package
        cp bin/Cemu_release.exe package/Cemu.exe
        cp -R bin/gameProfiles bin/resources package/
        (cd package && 7z a -tzip -mx=9 ../Cemu-dualscreen-windows-x64.zip . > /dev/null)
        ls -la Cemu-dualscreen-windows-x64.zip

    - uses: actions/upload-artifact@v4
      with:
        name: windows
        path: Cemu-dualscreen-windows-x64.zip

  publish:
    name: Publish
    needs: [build, build-windows]
    # Whatever was built, even if something else was not.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Replace the nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ls -la dist
        if [ -z "$(ls -A dist 2>/dev/null)" ]; then
          echo "::error::Nothing was built."
          exit 1
        fi
        short="${GITHUB_SHA::7}"
        cat > dist/version.json <<EOF
        {"build": ${{ github.run_number }}, "commit": "${GITHUB_SHA}", "branch": "${GITHUB_REF_NAME}", "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
        EOF
        {
          printf 'Build %s, from %s on %s.\n\n' "${{ github.run_number }}" "$short" "$GITHUB_REF_NAME"
          echo "For Dualscreen's Wii U games: let Dualscreen fetch and update it, or point \`wii_u_program\` at it."
          echo
          echo "- **Linux**: \`Cemu-dualscreen-x86_64.AppImage\` -- make it executable."
          echo "- **Windows**: \`Cemu-dualscreen-windows-x64.zip\` -- unzip it and use \`Cemu.exe\`."
          missing=""
          [ -f dist/Cemu-dualscreen-x86_64.AppImage ] || missing="$missing Linux"
          [ -f dist/Cemu-dualscreen-windows-x64.zip ] || missing="$missing Windows"
          if [ -n "$missing" ]; then
            echo
            echo "Not in this build, because it failed:$missing."
          fi
        } > notes.md
        gh release delete nightly --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
        gh release create nightly dist/* -R "$GITHUB_REPOSITORY" \
          --prerelease --target "$GITHUB_SHA" \
          --title "Dualscreen nightly build ${{ github.run_number }}" --notes-file notes.md
